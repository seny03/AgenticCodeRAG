[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-code-rag"
version = "0.1.0"
description = "Repository-aware LangGraph agent for code completion and bug fixing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-community>=0.2.0",

    # Data / evaluation
    "datasets>=2.19.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Retrieval
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",

    # Code metrics
    "codebleu @ git+https://github.com/k4black/codebleu.git@main",

    # Utilities
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "PyYAML>=6.0.1",
    "ujson>=5.9.0",
    "jsonlines>=4.0.0",
]

[project.optional-dependencies]
scip = [
    "protobuf>=4.25.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
acr-index   = "agentic_code_rag.cli.index:main"
acr-agent   = "agentic_code_rag.cli.agent:main"
acr-bench   = "agentic_code_rag.cli.bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
